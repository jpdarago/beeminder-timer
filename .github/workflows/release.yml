name: Deploy Beeminder Timer

# Build the site and force-push the result to the `deploy` branch. The server's
# repo-puller polls that branch and copies it into /var/www/html/beeminder-timer
# (see deploy.sh, which ships inside the branch). The server's SSH is
# Tailscale-only, so CI cannot push to it directly.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Add server deploy script to the artifact
        run: cp deploy.sh dist/deploy.sh

      - name: Push dist/ to the deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          cd dist
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
